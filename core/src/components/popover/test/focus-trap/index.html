<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Popover - Focus Trap</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <link href="../../../../../css/ionic.bundle.css" rel="stylesheet" />
    <link href="../../../../../scripts/testing/styles.css" rel="stylesheet" />
    <script src="../../../../../scripts/testing/scripts.js"></script>
    <script type="module" src="../../../../../dist/ionic/ionic.esm.js"></script>
  </head>

  <body>
    <ion-app>
      <div class="ion-page">
        <ion-content class="ion-padding">
          <button id="open-popover">Open Popover</button>
          <!-- Focusing this while the popover is open triggers the trap's redirect. -->
          <div tabindex="0">Focusable element outside of the popover</div>
        </ion-content>
      </div>

      <ion-popover trigger="open-popover">
        <ion-list>
          <ion-item>
            <ion-toggle>Notifications</ion-toggle>
          </ion-item>
        </ion-list>
      </ion-popover>
    </ion-app>
  </body>
</html>
