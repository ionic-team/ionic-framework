<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Icon - Font</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link href="../../../../../css/ionic.bundle.css" rel="stylesheet" />
    <link href="../../../../../scripts/testing/styles.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <script src="../../../../../scripts/testing/scripts.js"></script>
    <script nomodule src="../../../../../dist/ionic/ionic.js"></script>
    <script type="module" src="../../../../../dist/ionic/ionic.esm.js"></script>
  </head>

  <body>
    <ion-app>
      <ion-header>
        <ion-toolbar>
          <ion-title>Icon - Font</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding-horizontal">
        <h2>Phosphor icons: regular</h2>
        <ion-icon>
          <i class="ph ph-house"></i>
        </ion-icon>
        <ion-icon>
          <i class="ph ph-heart"></i>
        </ion-icon>
        <ion-icon>
          <i class="ph ph-star"></i>
        </ion-icon>
        <ion-icon>
          <i class="ph ph-user"></i>
        </ion-icon>
        <ion-icon>
          <i class="ph ph-gear"></i>
        </ion-icon>
        <ion-icon>
          <i class="ph ph-airplane"></i>
        </ion-icon>
        <ion-icon>
          <i class="ph ph-trash"></i>
        </ion-icon>
        <ion-icon>
          <i class="ph ph-globe"></i>
        </ion-icon>
        <ion-icon>
          <i class="ph ph-lock"></i>
        </ion-icon>

        <h2>Phosphor icons: fill</h2>
        <ion-icon>
          <i class="ph-fill ph-house"></i>
        </ion-icon>
        <ion-icon>
          <i class="ph-fill ph-heart"></i>
        </ion-icon>
        <ion-icon>
          <i class="ph-fill ph-star"></i>
        </ion-icon>
        <ion-icon>
          <i class="ph-fill ph-user"></i>
        </ion-icon>
        <ion-icon>
          <i class="ph-fill ph-gear"></i>
        </ion-icon>
        <ion-icon>
          <i class="ph-fill ph-airplane"></i>
        </ion-icon>
        <ion-icon>
          <i class="ph-fill ph-trash"></i>
        </ion-icon>
        <ion-icon>
          <i class="ph-fill ph-globe"></i>
        </ion-icon>
        <ion-icon>
          <i class="ph-fill ph-lock"></i>
        </ion-icon>

        <h2>Phosphor icons: color</h2>
        <ion-icon color="primary">
          <i class="ph ph-house"></i>
        </ion-icon>
        <ion-icon color="secondary">
          <i class="ph ph-heart"></i>
        </ion-icon>
        <ion-icon color="tertiary">
          <i class="ph ph-star"></i>
        </ion-icon>
        <ion-icon color="success">
          <i class="ph ph-user"></i>
        </ion-icon>
        <ion-icon color="warning">
          <i class="ph ph-gear"></i>
        </ion-icon>
        <ion-icon color="danger">
          <i class="ph ph-airplane"></i>
        </ion-icon>
        <ion-icon color="light">
          <i class="ph ph-trash"></i>
        </ion-icon>
        <ion-icon color="medium">
          <i class="ph ph-globe"></i>
        </ion-icon>
        <ion-icon color="dark">
          <i class="ph ph-lock"></i>
        </ion-icon>
        <br>
        <ion-icon color="primary">
          <i class="ph-fill ph-house"></i>
        </ion-icon>
        <ion-icon color="secondary">
          <i class="ph-fill ph-heart"></i>
        </ion-icon>
        <ion-icon color="tertiary">
          <i class="ph-fill ph-star"></i>
        </ion-icon>
        <ion-icon color="success">
          <i class="ph-fill ph-user"></i>
        </ion-icon>
        <ion-icon color="warning">
          <i class="ph-fill ph-gear"></i>
        </ion-icon>
        <ion-icon color="danger">
          <i class="ph-fill ph-airplane"></i>
        </ion-icon>
        <ion-icon color="light">
          <i class="ph-fill ph-trash"></i>
        </ion-icon>
        <ion-icon color="medium">
          <i class="ph-fill ph-globe"></i>
        </ion-icon>
        <ion-icon color="dark">
          <i class="ph-fill ph-lock"></i>
        </ion-icon>

        <h2>Phosphor icons: custom sizing</h2>
        <ion-icon style="font-size: 16px">
          <i class="ph ph-house"></i>
        </ion-icon>
        <ion-icon style="font-size: 20px">
          <i class="ph ph-heart"></i>
        </ion-icon>
        <ion-icon style="font-size: 24px">
          <i class="ph ph-star"></i>
        </ion-icon>
        <ion-icon style="font-size: 28px">
          <i class="ph ph-user"></i>
        </ion-icon>
        <ion-icon style="font-size: 32px">
          <i class="ph ph-gear"></i>
        </ion-icon>
        <ion-icon style="font-size: 36px">
          <i class="ph ph-airplane"></i>
        </ion-icon>
        <ion-icon style="font-size: 40px">
          <i class="ph ph-trash"></i>
        </ion-icon>
        <ion-icon style="font-size: 44px">
          <i class="ph ph-globe"></i>
        </ion-icon>
        <ion-icon style="font-size: 48px">
          <i class="ph ph-lock"></i>
        </ion-icon>
        <br>
        <ion-icon style="font-size: 16px">
          <i class="ph-fill ph-house"></i>
        </ion-icon>
        <ion-icon style="font-size: 20px">
          <i class="ph-fill ph-heart"></i>
        </ion-icon>
        <ion-icon style="font-size: 24px">
          <i class="ph-fill ph-star"></i>
        </ion-icon>
        <ion-icon style="font-size: 28px">
          <i class="ph-fill ph-user"></i>
        </ion-icon>
        <ion-icon style="font-size: 32px">
          <i class="ph-fill ph-gear"></i>
        </ion-icon>
        <ion-icon style="font-size: 36px">
          <i class="ph-fill ph-airplane"></i>
        </ion-icon>
        <ion-icon style="font-size: 40px">
          <i class="ph-fill ph-trash"></i>
        </ion-icon>
        <ion-icon style="font-size: 44px">
          <i class="ph-fill ph-globe"></i>
        </ion-icon>
        <ion-icon style="font-size: 48px">
          <i class="ph-fill ph-lock"></i>
        </ion-icon>
      </ion-content>
    </ion-app>

    <style>
      h2 {
        text-transform: uppercase;
        font-size: 14px;
        color: #444;
        font-weight: bold;
        margin-top: 24px;
      }

      /* Increase icon size to see icons better */
      ion-icon {
        font-size: 32px;
      }
    </style>
  </body>
</html>
