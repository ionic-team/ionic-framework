<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Item Sliding - Switching Sides</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../../../../../css/ionic.bundle.css" rel="stylesheet" />
    <link href="../../../../../scripts/testing/styles.css" rel="stylesheet" />
    <script src="../../../../../scripts/testing/scripts.js"></script>
    <script nomodule src="../../../../../dist/ionic/ionic.js"></script>
    <script type="module" src="../../../../../dist/ionic/ionic.esm.js"></script>
  </head>
  <body>
    <ion-app>
      <ion-content>
        <p>
          Open one side, then the other. The new option should remain clickable and the item should still swipe closed.
        </p>
        <button onclick="document.querySelector('ion-item-sliding').open('start')">Open start</button>
        <button onclick="document.querySelector('ion-item-sliding').open('end')">Open end</button>
        <ion-list>
          <ion-item-sliding>
            <ion-item><ion-label>Sliding item</ion-label></ion-item>
            <ion-item-options side="start">
              <ion-item-option onclick="document.querySelector('output').textContent = 'Start clicked'"
                >Start</ion-item-option
              >
            </ion-item-options>
            <ion-item-options side="end">
              <ion-item-option onclick="document.querySelector('output').textContent = 'End clicked'"
                >End</ion-item-option
              >
            </ion-item-options>
          </ion-item-sliding>
        </ion-list>
        <output aria-live="polite"></output>
      </ion-content>
    </ion-app>
  </body>
</html>
