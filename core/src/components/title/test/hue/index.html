<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Title - Hue</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link href="../../../../../css/ionic.bundle.css" rel="stylesheet" />
    <link href="../../../../../scripts/testing/styles.css" rel="stylesheet" />
    <script src="../../../../../scripts/testing/scripts.js"></script>
    <script nomodule src="../../../../../dist/ionic/ionic.js"></script>
    <script type="module" src="../../../../../dist/ionic/ionic.esm.js"></script>
  </head>

  <body>
    <ion-app>
      <ion-content>
        <h2>Title Hue: Bold</h2>

        <div id="bold">
          <ion-toolbar><ion-title hue="bold">Default</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="bold" color="primary">Primary</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="bold" color="secondary">Secondary</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="bold" color="tertiary">Tertiary</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="bold" color="success">Success</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="bold" color="warning">Warning</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="bold" color="danger">Danger</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="bold" color="light">Light</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="bold" color="medium">Medium</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="bold" color="dark">Dark</ion-title></ion-toolbar>
        </div>

        <h2>Title Hue: Subtle</h2>

        <div id="subtle">
          <ion-toolbar><ion-title hue="subtle">Default</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="subtle" color="primary">Primary</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="subtle" color="secondary">Secondary</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="subtle" color="tertiary">Tertiary</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="subtle" color="success">Success</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="subtle" color="warning">Warning</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="subtle" color="danger">Danger</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="subtle" color="light">Light</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="subtle" color="medium">Medium</ion-title></ion-toolbar>
          <ion-toolbar><ion-title hue="subtle" color="dark">Dark</ion-title></ion-toolbar>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
