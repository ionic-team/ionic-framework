<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Modal - a11y</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <link href="../../../../../css/ionic.bundle.css" rel="stylesheet" />
    <link href="../../../../../scripts/testing/styles.css" rel="stylesheet" />
    <script src="../../../../../scripts/testing/scripts.js"></script>
    <script type="module" src="../../../../../dist/ionic/ionic.esm.js"></script>
  </head>

  <body>
    <main>
      <h1>Modal - a11y</h1>

      <button id="open-modal">Open Modal</button>
      <ion-modal id="a11y-modal" aria-label="My custom label" trigger="open-modal">My content</ion-modal>

      <button id="open-labelledby-modal">Open Modal with aria-labelledby</button>
      <ion-modal id="labelledby-modal" aria-labelledby="modal-title" trigger="open-labelledby-modal">
        <ion-header>
          <ion-toolbar>
            <ion-title id="modal-title">My modal title</ion-title>
          </ion-toolbar>
        </ion-header>
        <ion-content>My content</ion-content>
      </ion-modal>
    </main>
  </body>
</html>
