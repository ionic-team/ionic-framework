<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Modal - Content Height</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link href="../../../../../css/ionic.bundle.css" rel="stylesheet" />
    <link href="../../../../../scripts/testing/styles.css" rel="stylesheet" />
    <script src="../../../../../scripts/testing/scripts.js"></script>
    <script type="module" src="../../../../../dist/ionic/ionic.esm.js"></script>
    <script>
      /* Page two is taller than page one, to show the modal resize on navigation. */
      class NavPageOne extends HTMLElement {
        connectedCallback() {
          this.innerHTML = `
            <ion-header>
              <ion-toolbar>
                <ion-title>Page One</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content class="ion-padding">
              <p>Short first page.</p>
              <ion-nav-link router-direction="forward" component="nav-page-two">
                <button id="go-page-two">Go to Page Two</button>
              </ion-nav-link>
            </ion-content>
          `;
        }
      }

      class NavPageTwo extends HTMLElement {
        connectedCallback() {
          this.innerHTML = `
            <ion-header>
              <ion-toolbar>
                <ion-buttons slot="start">
                  <ion-back-button></ion-back-button>
                </ion-buttons>
                <ion-title>Page Two</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content class="ion-padding">
              <div id="tall-block" style="height: 320px; background: #d0e6ff"></div>
            </ion-content>
          `;
        }
      }

      class NavHost extends HTMLElement {
        connectedCallback() {
          this.innerHTML = `
            <ion-content>
              <ion-nav root="nav-page-one"></ion-nav>
            </ion-content>
          `;
        }
      }

      customElements.define('nav-page-one', NavPageOne);
      customElements.define('nav-page-two', NavPageTwo);
      customElements.define('nav-host', NavHost);
    </script>

    <style>
      /** 
       * Shared modal styles. Only the height differs 
       * between the modal examples. 
       */
      ion-modal {
        --width: fit-content;
        --min-width: 250px;
        --border-radius: 6px;
        --box-shadow: 0 28px 48px rgba(0, 0, 0, 0.4);
      }

      /**
       * Content-based Heights
       * --------------------------------------------------
       * Each of these sizes the modal from its contents. 
       */
      ion-modal#fit-content-modal {
        --height: fit-content;
      }

      ion-modal#auto-modal {
        --height: auto;
      }

      ion-modal#min-content-modal {
        --height: min-content;
      }

      ion-modal#max-content-modal {
        --height: max-content;
      }

      /**
       * Definite Heights
       * --------------------------------------------------
       * A definite height is not sized from its contents, 
       * so the content is free to overflow.
       */
      ion-modal#px-modal {
        --height: 300px;
      }

      /**
       * Taller than the overlay. The default `--max-height: 100%` clamps this,
       * where before it would run off screen.
       */
      ion-modal#px-tall-modal {
        --height: 2000px;
      }

      /**
       * Overflowing Content
       * --------------------------------------------------
       * A content-sized modal with overflowing content. 
       * The default `--max-height: 100%` clamps this, where 
       * before it would run off screen.
       */
      ion-modal#long-modal {
        --height: fit-content;
      }

      /* The same long list with a max height. */
      ion-modal#long-max-height-modal {
        --height: fit-content;
        --max-height: 50%;
      }

      /**
       * Other Content-based Cases
       * --------------------------------------------------
       */

      /**
       * A content-sized modal containing an `ion-nav` must be handled 
       * differently because a nav uses `position: absolute` by default.
       */
      ion-modal#nav-modal {
        --height: fit-content;
      }

      /**
       * No `ion-content` at all. This does not require any special handling,
       * but we want to make sure it did not regress.
       */
      ion-modal#no-content-modal {
        --height: fit-content;
      }

      /**
       * Known Gaps
       * --------------------------------------------------
       */

      /**
       * Known gap: `part="content"` is the same element that `--height` sizes,
       * so this collapses exactly like the others, but the height keyword is
       * not readable from the custom property and is therefore not detected.
       * Expect a modal displaying only a header here.
       */
      ion-modal#part-modal::part(content) {
        height: fit-content;
      }
    </style>
  </head>

  <body>
    <ion-app>
      <div class="ion-page">
        <ion-header>
          <ion-toolbar>
            <ion-title>Modal - Content Height</ion-title>
          </ion-toolbar>
        </ion-header>

        <ion-content class="ion-padding">
          <h2>Content-based heights</h2>
          <button class="expand" id="open-fit-content">--height: fit-content</button>
          <button class="expand" id="open-auto">--height: auto</button>
          <button class="expand" id="open-min-content">--height: min-content</button>
          <button class="expand" id="open-max-content">--height: max-content</button>

          <h2>Definite heights</h2>
          <button class="expand" id="open-default">default height</button>
          <button class="expand" id="open-px">--height: 300px</button>
          <button class="expand" id="open-px-tall">--height: 2000px (taller than screen)</button>

          <h2>Overflowing content</h2>
          <button class="expand" id="open-long">--height: fit-content, overflowing</button>
          <button class="expand" id="open-long-max-height">--height: fit-content, overflowing, max height</button>

          <h2>Other content-based cases</h2>
          <button class="expand" id="open-nav">--height: fit-content, ion-nav</button>
          <button class="expand" id="open-no-content">--height: fit-content, no ion-content</button>
          <button class="expand" id="open-toggle">--height: toggled at runtime</button>

          <h2>Known gaps</h2>
          <button class="expand red" id="open-part" color="danger">::part(content)</button>

          <ion-modal id="fit-content-modal" trigger="open-fit-content">
            <ion-header>
              <ion-toolbar>
                <ion-title>fit-content</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <div class="wrapper"><ion-list class="short" lines="none"></ion-list></div>
            </ion-content>
          </ion-modal>

          <ion-modal id="auto-modal" trigger="open-auto">
            <ion-header>
              <ion-toolbar>
                <ion-title>auto</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <div class="wrapper"><ion-list class="short" lines="none"></ion-list></div>
            </ion-content>
          </ion-modal>

          <ion-modal id="min-content-modal" trigger="open-min-content">
            <ion-header>
              <ion-toolbar>
                <ion-title>min-content</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <div class="wrapper"><ion-list class="short" lines="none"></ion-list></div>
            </ion-content>
          </ion-modal>

          <ion-modal id="max-content-modal" trigger="open-max-content">
            <ion-header>
              <ion-toolbar>
                <ion-title>max-content</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <div class="wrapper"><ion-list class="short" lines="none"></ion-list></div>
            </ion-content>
          </ion-modal>

          <!-- Control: the default modal must fill the screen height. -->
          <ion-modal id="default-modal" trigger="open-default">
            <ion-header>
              <ion-toolbar>
                <ion-title>default height</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <div class="wrapper"><ion-list class="short" lines="none"></ion-list></div>
            </ion-content>
          </ion-modal>

          <ion-modal id="px-modal" trigger="open-px">
            <ion-header>
              <ion-toolbar>
                <ion-title>300px</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <div class="wrapper"><ion-list class="long" lines="none"></ion-list></div>
            </ion-content>
          </ion-modal>

          <ion-modal id="px-tall-modal" trigger="open-px-tall">
            <ion-header>
              <ion-toolbar>
                <ion-title>2000px</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <div class="wrapper"><ion-list class="long" lines="none"></ion-list></div>
            </ion-content>
          </ion-modal>

          <ion-modal id="long-modal" trigger="open-long">
            <ion-header>
              <ion-toolbar>
                <ion-title>fit-content</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <div class="wrapper"><ion-list class="long" lines="none"></ion-list></div>
            </ion-content>
          </ion-modal>

          <ion-modal id="long-max-height-modal" trigger="open-long-max-height">
            <ion-header>
              <ion-toolbar>
                <ion-title>fit-content, max-height</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <div class="wrapper"><ion-list class="long" lines="none"></ion-list></div>
            </ion-content>
          </ion-modal>

          <ion-modal id="nav-modal" trigger="open-nav"></ion-modal>

          <!-- A modal built without ion-content, sized entirely by its markup. -->
          <ion-modal id="no-content-modal" trigger="open-no-content">
            <div class="wrapper">
              <h1 class="ion-margin-horizontal">Modal header</h1>
              <ion-list class="short" lines="none"></ion-list>
            </div>
          </ion-modal>

          <ion-modal id="toggle-modal" trigger="open-toggle">
            <ion-header>
              <ion-toolbar>
                <ion-title>Toggled height</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <div class="wrapper">
                <button id="toggle-height">Toggle --height</button>
                <ion-list class="short" lines="none"></ion-list>
              </div>
            </ion-content>
          </ion-modal>

          <ion-modal id="part-modal" trigger="open-part">
            <ion-header>
              <ion-toolbar>
                <ion-title>::part(content)</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <div class="wrapper"><ion-list class="short" lines="none"></ion-list></div>
            </ion-content>
          </ion-modal>
        </ion-content>
      </div>
    </ion-app>

    <script>
      function fillList(list, count) {
        for (let i = 0; i < count; i++) {
          const item = document.createElement('ion-item');
          item.setAttribute('button', 'true');
          item.setAttribute('detail', 'false');

          const icon = document.createElement('ion-icon');
          icon.setAttribute('name', 'person-circle');
          icon.setAttribute('slot', 'start');

          const label = document.createElement('ion-label');
          label.textContent = `Item ${i + 1}`;

          item.appendChild(icon);
          item.appendChild(label);
          list.appendChild(item);
        }
      }

      /**
       * Passing an element rather than a tag name reuses one nav host. With
       * `component="nav-host"` the delegate creates another one on every
       * present and never removes the last, so they pile up.
       */
      document.querySelector('ion-modal#nav-modal').component = document.createElement('nav-host');

      /**
       * Adds and removes an inline `--height`, so the modal falls back to its
       * own default in between.
       */
      document.querySelector('button#toggle-height').addEventListener('click', () => {
        const modal = document.querySelector('ion-modal#toggle-modal');
        if (modal.style.getPropertyValue('--height') === '') {
          modal.style.setProperty('--height', 'fit-content');
        } else {
          modal.style.removeProperty('--height');
        }
      });

      document.querySelectorAll('ion-list.short').forEach((list) => fillList(list, 3));
      document.querySelectorAll('ion-list.long').forEach((list) => fillList(list, 30));

      // Selecting an item dismisses the modal it belongs to.
      document.querySelectorAll('ion-modal').forEach((modal) => {
        modal.addEventListener('click', (ev) => {
          if (ev.target.closest('ion-item') !== null) {
            modal.dismiss();
          }
        });
      });
    </script>
  </body>
</html>
