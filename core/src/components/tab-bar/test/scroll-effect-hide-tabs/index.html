<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Tab Bar - Scroll Effect Hide Tabs</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link href="../../../../../css/ionic.bundle.css" rel="stylesheet" />
    <link href="../../../../../scripts/testing/styles.css" rel="stylesheet" />
    <script src="../../../../../scripts/testing/scripts.js"></script>
    <script nomodule src="../../../../../dist/ionic/ionic.js"></script>
    <script type="module" src="../../../../../dist/ionic/ionic.esm.js"></script>
  </head>

  <body>
    <ion-app>
      <ion-tabs>
        <ion-tab tab="tab-one">
          <ion-nav root="page-one"></ion-nav>
        </ion-tab>

        <ion-tab tab="tab-two">
          <ion-header>
            <ion-toolbar>
              <ion-title>Tab Two</ion-title>
            </ion-toolbar>
          </ion-header>
          <ion-content>
            <div class="ion-padding" style="height: 3000px">Tab Two</div>
          </ion-content>
        </ion-tab>

        <ion-tab tab="tab-three">
          <ion-header>
            <ion-toolbar>
              <ion-title>Tab Three</ion-title>
            </ion-toolbar>
          </ion-header>
          <ion-content tab-bar-scroll-effect="false">
            <div class="ion-padding" style="height: 3000px">Tab Three</div>
          </ion-content>
        </ion-tab>

        <ion-tab-bar slot="bottom" scroll-effect="hide">
          <ion-tab-button tab="tab-one">
            <ion-label>Tab One</ion-label>
          </ion-tab-button>
          <ion-tab-button tab="tab-two">
            <ion-label>Tab Two</ion-label>
          </ion-tab-button>
          <ion-tab-button tab="tab-three">
            <ion-label>Tab Three</ion-label>
          </ion-tab-button>
        </ion-tab-bar>
      </ion-tabs>
    </ion-app>

    <script>
      class PageOne extends HTMLElement {
        connectedCallback() {
          this.innerHTML = `
            <ion-header>
              <ion-toolbar>
                <ion-title>Page One</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <ion-button id="push-page-two" onclick="document.querySelector('ion-nav').push('page-two')">
                Push Page Two
              </ion-button>
              <ion-button id="push-page-three" onclick="document.querySelector('ion-nav').push('page-three')">
                Push Page Three
              </ion-button>
              <div class="ion-padding" style="height: 3000px">Page One</div>
            </ion-content>
          `;
        }
      }

      class PageTwo extends HTMLElement {
        connectedCallback() {
          this.innerHTML = `
            <ion-header>
              <ion-toolbar>
                <ion-title>Page Two</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <div class="ion-padding" style="height: 3000px">Page Two</div>
            </ion-content>
          `;
        }
      }

      class PageThree extends HTMLElement {
        connectedCallback() {
          this.innerHTML = `
            <ion-header>
              <ion-toolbar>
                <ion-title>Page Three</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content tab-bar-scroll-effect="true">
              <div class="ion-padding" style="height: 3000px">Page Three</div>
            </ion-content>
          `;
        }
      }

      customElements.define('page-one', PageOne);
      customElements.define('page-two', PageTwo);
      customElements.define('page-three', PageThree);
    </script>
  </body>
</html>
