<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Nav - Routing</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link href="../../../../../css/ionic.bundle.css" rel="stylesheet" />
    <link href="../../../../../scripts/testing/styles.css" rel="stylesheet" />
    <script src="../../../../../scripts/testing/scripts.js"></script>
    <script nomodule src="../../../../../dist/ionic/ionic.js"></script>
    <script type="module" src="../../../../../dist/ionic/ionic.esm.js"></script>
  </head>

  <body>
    <!--
      As of Ionic 9, ion-nav no longer integrates with ion-router. This page
      reproduces the pattern from https://github.com/ionic-team/ionic-framework/issues/24641,
      where an ion-router and an ion-nav coexist. The ion-nav must manage its own
      stack via `root` and ion-nav-link, the URL must never change as the stack
      changes, and the page must still finish loading even though the router has no
      outlet to drive.
    -->
    <ion-app>
      <ion-router use-hash="true">
        <ion-route url="/" component="page-root"></ion-route>
        <ion-route url="/page-one" component="page-one"></ion-route>
        <ion-route url="/page-two" component="page-two"></ion-route>
      </ion-router>
      <ion-nav root="page-root"></ion-nav>
    </ion-app>

    <script>
      class PageRoot extends HTMLElement {
        connectedCallback() {
          this.innerHTML = `
          <ion-header>
            <ion-toolbar>
              <ion-title>Root</ion-title>
            </ion-toolbar>
          </ion-header>
          <ion-content class="ion-padding">
            <h1>Root</h1>
            <div>
              <ion-nav-link router-direction="forward" component="page-one">
                <button class="next">Go to Page One</button>
              </ion-nav-link>
            </div>
          </ion-content>
        `;
        }
      }
      class PageOne extends HTMLElement {
        connectedCallback() {
          this.innerHTML = `
          <ion-header>
            <ion-toolbar>
              <ion-buttons slot="start">
                <ion-back-button></ion-back-button>
              </ion-buttons>
              <ion-title>Page One</ion-title>
            </ion-toolbar>
          </ion-header>
          <ion-content class="ion-padding">
            <h1>Page One</h1>
            <ion-nav-link router-direction="forward" component="page-two">
              <button class="next">Go to Page Two</button>
            </ion-nav-link>
          </ion-content>
        `;
        }
      }
      class PageTwo extends HTMLElement {
        connectedCallback() {
          this.innerHTML = `
          <ion-header>
            <ion-toolbar>
              <ion-buttons slot="start">
                <ion-back-button></ion-back-button>
              </ion-buttons>
              <ion-title>Page Two</ion-title>
            </ion-toolbar>
          </ion-header>
          <ion-content class="ion-padding">
            <h1>Page Two</h1>
          </ion-content>
        `;
        }
      }
      customElements.define('page-root', PageRoot);
      customElements.define('page-one', PageOne);
      customElements.define('page-two', PageTwo);
    </script>
  </body>
</html>
