<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Fab Button - Animation</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link href="../../../../../css/ionic.bundle.css" rel="stylesheet" />
    <link href="../../../../../scripts/testing/styles.css" rel="stylesheet" />
    <script src="../../../../../scripts/testing/scripts.js"></script>
    <script nomodule src="../../../../../dist/ionic/ionic.js"></script>
    <script type="module" src="../../../../../dist/ionic/ionic.esm.js"></script>
    <style>
      .row {
        display: flex;
        gap: 64px;

        margin-bottom: 220px;
      }
    </style>
  </head>

  <body>
    <ion-app>
      <ion-header>
        <ion-toolbar>
          <ion-title>Fab Button - Animation</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <div class="row">
          <div>
            <h2>Default</h2>
            <ion-fab>
              <ion-fab-button>
                <ion-icon name="add"></ion-icon>
              </ion-fab-button>
              <ion-fab-list side="bottom">
                <ion-fab-button>
                  <ion-icon name="logo-github"></ion-icon>
                </ion-fab-button>
                <ion-fab-button>
                  <ion-icon name="logo-npm"></ion-icon>
                </ion-fab-button>
              </ion-fab-list>
            </ion-fab>
          </div>

          <div>
            <h2>animated="false"</h2>
            <ion-fab>
              <ion-fab-button animated="false">
                <ion-icon name="add"></ion-icon>
              </ion-fab-button>
              <ion-fab-list side="bottom">
                <ion-fab-button animated="false">
                  <ion-icon name="logo-github"></ion-icon>
                </ion-fab-button>
                <ion-fab-button animated="false">
                  <ion-icon name="logo-npm"></ion-icon>
                </ion-fab-button>
              </ion-fab-list>
            </ion-fab>
          </div>
        </div>
      </ion-content>
    </ion-app>
  </body>
</html>
