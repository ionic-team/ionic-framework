<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Overlays</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link href="../../../../../css/ionic.bundle.css" rel="stylesheet" />
    <link href="../../../../../scripts/testing/styles.css" rel="stylesheet" />
    <script src="../../../../../scripts/testing/scripts.js"></script>
    <script type="module" src="../../../../../dist/ionic/ionic.esm.js"></script>
    <script type="module">
      import { modalController, toastController, createAnimation } from '../../../../../dist/ionic/index.esm.js';
      window.modalController = modalController;
      window.toastController = toastController;
    </script>
  </head>

  <body>
    <ion-app>
      <ion-menu content-id="main-content">
        <ion-content>
          <ion-button onclick="openModal(event)">Open Modal</ion-button>
        </ion-content>
      </ion-menu>
      <div class="ion-page" id="main-content">
        <ion-header>
          <ion-toolbar>
            <ion-title>Modal - Inline</ion-title>
          </ion-toolbar>
        </ion-header>

        <ion-content class="ion-padding">
          <ion-item>
            <ion-input label="Text Input" id="root-input"></ion-input>
          </ion-item>

          <ion-button id="create" onclick="createModal()">Create a Modal</ion-button>
          <ion-button id="create-nested" onclick="createNestedOverlayModal()">Create Nested Overlay Modal</ion-button>
          <ion-button id="present" onclick="presentHiddenModal()">Present a Hidden Modal</ion-button>
          <ion-button id="create-and-present" onclick="createAndPresentModal()">Create and Present a Modal</ion-button>
          <ion-button id="simulate" onclick="backButton()">Simulate Hardware Back Button</ion-button>
          <ion-button id="create-and-present-toast" onclick="createAndPresentToast()"
            >Create and Present Toast</ion-button
          >
          <ion-button id="create-and-present-focus-trap" onclick="createAndPresentFocusTrapModal()"
            >Create and Present Focus Trap Modal</ion-button
          >
        </ion-content>
      </div>
    </ion-app>

    <script>
      let modals = 0;
      const createModal = async () => {
        const div = document.createElement('div');
        const id = modals++;
        div.classList.add(`modal-${id}`);
        div.innerHTML = `
          <ion-header>
            <ion-toolbar>
              <ion-title>Modal</ion-title>
            </ion-toolbar>
          </ion-header>
          <ion-content class="ion-padding">
            Modal ${id}

            <ion-item>
              <ion-input label="Text Input" class="modal-input modal-input-${id}"></ion-input>
            </ion-item>

            <ion-button id="modal-create">Create a Modal</ion-button>
            <ion-button id="modal-create-and-present">Create and Present a Modal</ion-button>
            <ion-button id="modal-simulate">Simulate Hardware Back Button</ion-button>
            <ion-button id="modal-toast">Present a Toast</ion-button>

          </ion-content>
        `;

        const createButton = div.querySelector('ion-button#modal-create');
        createButton.onclick = () => {
          createModal();
        };

        const createAndPresentButton = div.querySelector('ion-button#modal-create-and-present');
        createAndPresentButton.onclick = () => {
          createAndPresentModal();
        };

        const simulateButton = div.querySelector('ion-button#modal-simulate');
        simulateButton.onclick = () => {
          backButton();
        };

        const presentToast = div.querySelector('ion-button#modal-toast');
        presentToast.onclick = () => {
          createAndPresentToast();
        };

        const modal = await modalController.create({
          component: div,
        });

        return modal;
      };

      const createAndPresentModal = async () => {
        const modal = await createModal();
        await modal.present();
      };

      const backButton = () => {
        const ev = new CustomEvent('backbutton');
        document.dispatchEvent(ev);
      };

      const presentHiddenModal = () => {
        const modal = document.querySelector('ion-modal.overlay-hidden');
        if (modal) {
          modal.present();
        }
      };

      const createAndPresentToast = async () => {
        const toast = await toastController.create({
          message: 'This is a toast!',
        });

        await toast.present();
      };

      /*
        Presents a modal for checking the focus trap's redirect by hand. An item
        holding a single checkbox is focusable without being clickable, so the
        trap resolves to the item itself and draws the indicator on it.

        Moving focus to an element outside the modal makes the trap redirect
        focus back in. The indicator should only follow that redirect when the
        interaction was keyboard driven.
      */
      const createAndPresentFocusTrapModal = async () => {
        const div = document.createElement('div');
        div.innerHTML = `
          <ion-content class="ion-padding">
            <ion-list>
              <ion-item>
                <ion-checkbox>Dark Mode</ion-checkbox>
              </ion-item>
            </ion-list>

            <ion-button id="modal-move-focus">Move focus outside</ion-button>

            <p>
              Pointer case: click the button above. Keyboard case: press ArrowDown.
              Both move focus to the same element outside the modal.
            </p>

            <p>
              Only the keyboard case should leave the indicator on the Dark Mode row.
              The indicator is a faint grey wash, so the reading below reports it
              directly.
            </p>

            <p id="focus-trap-status">indicator on the Dark Mode row: not checked yet</p>
          </ion-content>
        `;

        const report = () => {
          const item = div.querySelector('ion-item');
          const status = div.querySelector('#focus-trap-status');
          status.textContent = `indicator on the Dark Mode row: ${item.classList.contains('ion-focused')}`;
        };

        /*
          The reading is deferred a frame because `setFocus` is async, so the
          trap has not redirected focus back yet when it returns.
        */
        const moveFocusOutside = () => {
          document.querySelector('#root-input').setFocus();
          requestAnimationFrame(report);
        };

        const moveFocusButton = div.querySelector('ion-button#modal-move-focus');
        moveFocusButton.onclick = moveFocusOutside;

        /*
          ArrowDown gives the keyboard case a route that does not depend on tab
          order, since Tab does not reach the button while the trap holds focus
          on the wrapper.
        */
        const onKeydown = (ev) => {
          if (ev.key === 'ArrowDown') {
            moveFocusOutside();
          }
        };
        document.addEventListener('keydown', onKeydown);

        const modal = await modalController.create({
          component: div,
        });

        modal.onDidDismiss().then(() => {
          document.removeEventListener('keydown', onKeydown);
        });

        await modal.present();

        return modal;
      };

      const createNestedOverlayModal = async () => {
        const div = document.createElement('div');
        div.innerHTML = `
          <ion-header>
            <ion-toolbar>
              <ion-title>Modal</ion-title>
            </ion-toolbar>
          </ion-header>
          <ion-content class="ion-padding">
            Modal Content

            <ion-button id="modal-nested-overlay">Datetime inline modal</ion-button>
            <ion-button id="dismiss-modal-nested-overlay">Dismiss nested overlay</ion-button>

            <ion-modal trigger="modal-nested-overlay">
              <ion-content>
                <ion-datetime show-default-buttons></ion-datetime>
              </ion-content>
            </ion-modal>

          </ion-content>
        `;

        const dismissModalNestedOverlay = div.querySelector('ion-button#dismiss-modal-nested-overlay');
        dismissModalNestedOverlay.onclick = () => {
          window.modalController.getTop().then((top) => {
            top.dismiss();
          });
        };

        const modal = await modalController.create({
          component: div,
        });

        await modal.present();

        return modal;
      };

      window.Ionic = {
        config: {
          hardwareBackButton: true,
        },
      };
    </script>
  </body>
</html>
