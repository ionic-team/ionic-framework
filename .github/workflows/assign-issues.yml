name: Assign issues to triage

on:
  issues:
    types: [opened]

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 'Auto-assign issue'
        uses: pozil/auto-assign-issue@bec9ebf443592887b8f9bed643afafdfd3f62f1d # v4.0.2
        with:
          assignees: brandyscarney, thetaPC, ShaneK
          numOfAssignee: 1
          allowSelfAssign: false
