name: 'Build Ionic Vue Router'
description: 'Builds Ionic Vue Router'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
    - uses: ./.github/workflows/actions/download-archive
      with:
        name: ionic-core
        path: ./core
        filename: CoreBuild.zip
    - uses: ./.github/workflows/actions/download-archive
      with:
        name: ionic-vue
        path: ./packages/vue
        filename: VueBuild.zip
    - name: 🕸️ Install Vue Router Dependencies
      run: npm ci
      shell: bash
      working-directory: ./packages/vue-router
    - name: 🔄 Sync
      run: npm run sync
      shell: bash
      working-directory: ./packages/vue-router
    - name: 🖌️ Lint
      run: npm run lint
      shell: bash
      working-directory: ./packages/vue-router
    # The rollup build reports type errors as warnings and still succeeds, so
    # this step is what keeps the package type-clean.
    - name: 🔎 Typecheck
      run: npm run typecheck
      shell: bash
      working-directory: ./packages/vue-router
    - name: 🏗️ Build
      run: npm run build
      shell: bash
      working-directory: ./packages/vue-router
    - name: Clean package.json updates
      run: git checkout ./core/package.json
      shell: bash
    - name: 🔍 Check Diff
      run: git diff --exit-code
      shell: bash
    - uses: ./.github/workflows/actions/upload-archive
      with:
        name: ionic-vue-router
        output: ./packages/vue-router/VueRouterBuild.zip
        paths: packages/vue-router/dist
