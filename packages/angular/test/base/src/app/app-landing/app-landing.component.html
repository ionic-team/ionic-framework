<ion-header>
  <ion-toolbar>
    <ion-title>Test App - Angular {{ angularVersion.major }} </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <!--
      Plain hrefs, not routerLinks: routing into lazy never registers the Ionic
      custom elements, and routing into standalone from the lazy bootstrap runs it
      against the lazy implementation. See main.ts. The hrefs are relative so they
      resolve against <base href>, which is /angular/ on the Vercel preview.
    -->
    <ion-item href="lazy">
      <ion-label>Go to Lazy App</ion-label>
    </ion-item>
    <ion-item href="standalone">
      <ion-label>Go to Standalone App</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
